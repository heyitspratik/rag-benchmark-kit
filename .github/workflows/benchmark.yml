name: Benchmark

# Manual only. A full grid takes hours and downloads gigabytes of model weights, which is
# not something to hang off every push. The point of this workflow is reproducibility:
# anyone can dispatch it and see the harness produce numbers on a clean machine.
on:
  workflow_dispatch:
    inputs:
      eval_set:
        description: Which evaluation set to run
        type: choice
        default: data/eval/smoke.jsonl
        options:
          - data/eval/smoke.jsonl
          - data/eval/gdpr_ai_act_qa.jsonl
      experiment:
        description: Sweep to expand
        type: choice
        default: configs/experiments/smoke.yaml
        options:
          - configs/experiments/smoke.yaml
          - configs/experiments/full_grid.yaml
      model:
        description: Ollama model to generate with
        type: string
        default: llama3.2:3b

permissions:
  contents: read

jobs:
  benchmark:
    name: Run the grid
    runs-on: ubuntu-latest
    # A runner is not fast at CPU inference. The reduced grid against the smoke set fits
    # comfortably; the full grid against 116 questions will not, and is expected to be
    # run on a real machine instead.
    timeout-minutes: 120

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]

    env:
      POSTGRES_DSN: postgresql+psycopg://rag:rag@localhost:5432/rag_bench
      QDRANT_URL: http://localhost:6333
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: ${{ inputs.model }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --no-dev

      # Cached separately from the Python environment: model weights are large, change
      # rarely, and re-downloading them would dominate the run.
      - name: Restore the embedding model cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: hf-${{ hashFiles('configs/default.yaml') }}
          restore-keys: hf-

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull "${{ inputs.model }}"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Download the corpus
        run: uv run rag-bench corpus download

      - name: Verify the evaluation set before trusting any number from it
        run: uv run rag-bench eval verify --eval-set "${{ inputs.eval_set }}"

      - name: Show the plan
        run: |
          uv run rag-bench benchmark plan \
            --experiment "${{ inputs.experiment }}" \
            --eval-set "${{ inputs.eval_set }}"

      - name: Run the grid
        id: run
        run: |
          uv run rag-bench benchmark run \
            --experiment "${{ inputs.experiment }}" \
            --eval-set "${{ inputs.eval_set }}" \
            | tee /tmp/run.txt
          RUN_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/run.txt | head -1)
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish the table to the job summary
        run: |
          uv run rag-bench benchmark report "${{ steps.run.outputs.run_id }}" \
            --format markdown --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          if-no-files-found: error
