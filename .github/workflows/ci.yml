name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # An application, not a library: one version is all the signal a matrix would buy.
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Carries the pgvector extension, which the pgvector store needs.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    env:
      POSTGRES_DSN: postgresql+psycopg://rag:rag@localhost:5432/rag_bench
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  docker:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build (do not push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: rag-benchmark-kit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the image size and guard against runaway growth
        run: |
          BYTES=$(docker image inspect rag-benchmark-kit:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "Image size: ${MB} MB"
          echo "### Image size: ${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          # CPU torch alone is roughly 550 MB, so the ceiling reflects what is
          # achievable with local embeddings rather than an aspiration.
          if [ "$MB" -gt 1600 ]; then
            echo "Image grew past the 1600 MB ceiling." >&2
            exit 1
          fi

      - name: Smoke test the image
        run: |
          docker run --rm rag-benchmark-kit:ci rag-bench --version
          docker run --rm rag-benchmark-kit:ci alembic --version
          docker run --rm --user root rag-benchmark-kit:ci sh -c 'id -u appuser'

  commit-lint:
    name: Conventional commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
