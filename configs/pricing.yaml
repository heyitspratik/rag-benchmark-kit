# Token prices in US dollars per 1000 tokens, used to estimate what a configuration
# would cost at scale. Models absent from this table are treated as free, which is
# correct for the local Ollama and sentence-transformers defaults.
#
# Prices change. Treat every number here as an estimate and check the provider's current
# pricing before quoting a figure.
models:
  claude-sonnet-5:
    input_usd_per_1k: 0.003
    output_usd_per_1k: 0.015
  claude-haiku-4-5-20251001:
    input_usd_per_1k: 0.001
    output_usd_per_1k: 0.005
  gpt-4o-mini:
    input_usd_per_1k: 0.00015
    output_usd_per_1k: 0.0006
  text-embedding-3-small:
    input_usd_per_1k: 0.00002
    output_usd_per_1k: 0.0
