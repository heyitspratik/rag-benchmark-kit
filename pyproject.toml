[project]
name = "rag-benchmark-kit"
version = "0.1.0"
description = "A configurable, benchmarked Retrieval-Augmented Generation pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pratik Ahir" }]
keywords = ["rag", "retrieval", "benchmark", "llm", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "lxml>=5.3",
    "numpy>=1.26",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.3",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    # Declared directly, not just pulled in by sentence-transformers, so that the
    # CPU-only index below actually applies to it.
    "torch>=2.5",
    "typer>=0.15",
]

# RAGAS is optional. Its four metrics are LLM-judged, so they need a judge model and a
# live provider, whereas hit rate, MRR and abstention accuracy are deterministic and
# free. A default install stays lean and a benchmark run without this still reports.
[project.optional-dependencies]
ragas = ["ragas>=0.2.9"]

[project.urls]
Homepage = "https://github.com/pratikahir/rag-benchmark-kit"
Repository = "https://github.com/pratikahir/rag-benchmark-kit"

[project.scripts]
rag-bench = "rag_bench.cli.main:app"

# sentence-transformers pulls torch, whose default wheels carry the CUDA runtime and add
# roughly two gigabytes. Everything here runs on CPU, so take the CPU-only index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.13",
    "types-beautifulsoup4>=4.12",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
docs = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bench"]

# Lint / format

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting through their names, and interface stubs legitimately
# ignore the arguments they are handed.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107", "ARG001", "ARG002"]
"alembic/**" = ["D", "N999"]

[tool.ruff.format]
docstring-code-format = true

# Types

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# rank_bm25 ships no type information. Declared once here rather than as a per-import
# ignore, so the exception is visible in one place.
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "ragas.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: needs real Postgres/Qdrant containers; excluded from the default run",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/rag_bench"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
