[project]
name = "rag-benchmark-kit"
version = "0.1.0"
description = "A configurable, benchmarked Retrieval-Augmented Generation pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Pratik Ahir" }]
keywords = ["rag", "retrieval", "benchmark", "llm", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/pratikahir/rag-benchmark-kit"
Repository = "https://github.com/pratikahir/rag-benchmark-kit"

[project.scripts]
rag-bench = "rag_bench.cli.main:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
docs = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_bench"]

# Lint / format

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are self-documenting through their names, and interface stubs legitimately
# ignore the arguments they are handed.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ARG002"]
"alembic/**" = ["D", "N999"]

[tool.ruff.format]
docstring-code-format = true

# Types

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
    "integration: needs real Postgres/Qdrant containers; excluded from the default run",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/rag_bench"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
